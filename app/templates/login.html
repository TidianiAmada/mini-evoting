{% extends "base.html" %} {% block content %}
<div class="form-container">
  <h2 class="form-title">Sign in</h2>
  <form id="userForm" method="POST">
    <!-- Radio Buttons for Electeur and Organisateur -->
    <div class="radio-group">
      <div class="radio-label">
        <input type="radio" name="user_type" value="electeur" checked />
        <label>Electeur</label>
      </div>
      <div class="radio-label">
        <input type="radio" name="user_type" value="organisateur" />
        <label>Organisateur</label>
      </div>
    </div>

    <!-- Electeur Section -->
    <!-- Inside Electeur Section -->
    <div id="electeurFields">
      <label for="cne">CNE:</label>
      <textarea name="cne"></textarea><br />

      <!-- Video preview and capture -->
      <label>Selfie (front camera):</label>
      <video id="cameraPreview" autoplay playsinline width="200" height="150"></video><br />
      <button type="button" onclick="captureImage()">Capture Selfie</button>
      <input type="hidden" name="captured_image" id="capturedImage" />
      <canvas id="canvas" style="display: none;"></canvas>
    </div>

    <script>
      // Get camera access
      const video = document.getElementById('cameraPreview');

      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
        .then(stream => video.srcObject = stream)
        .catch(err => console.error("Camera error:", err));

      function captureImage() {
        const canvas = document.getElementById('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const imageData = canvas.toDataURL('image/png');
        document.getElementById('capturedImage').value = imageData;
      }
    </script>


    <!-- Organisateur Section -->
    <div id="organisateurFields" style="display: none">
      <label for="cni">CNI:</label>
      <input type="cni" name="cni" /><br />
      <!-- <textarea name="cni"></textarea><br /> -->
      <label for="email">Email:</label>
      <input type="email" name="email" /><br />
      <label for="password">Password:</label>
      <input type="password" name="password" /><br />
    </div>

    <button type="submit">Connexion</button>
  </form>
</div>

<!-- JavaScript to toggle fields -->
<script>
  const electeurFields = document.getElementById("electeurFields");
  const organisateurFields = document.getElementById("organisateurFields");

  document.querySelectorAll('input[name="user_type"]').forEach((radio) => {
    radio.addEventListener("change", function () {
      if (this.value === "electeur") {
        electeurFields.style.display = "block";
        organisateurFields.style.display = "none";
      } else {
        electeurFields.style.display = "none";
        organisateurFields.style.display = "block";
      }
    });
  });
</script>

{% endblock %}
